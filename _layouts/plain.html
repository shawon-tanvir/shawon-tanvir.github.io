---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}">
  <head>
    <meta charset="utf-8">
    {% include seo.html %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ base_path }}/images/site-logo.png">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/plain.css?v={{ site.time | date: '%s' }}">
  </head>

  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-aurora" aria-hidden="true"><span></span></div>
    <div class="scroll-progress" aria-hidden="true"></div>
    {{ content }}
    {% include analytics.html %}
    <script src="{{ base_path }}/assets/js/site.js?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
